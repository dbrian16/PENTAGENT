[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popperstrike"
version = "0.1.0"
description = "PopperStrike: Empirical & Verifiable Agentic Offensive Security. Karl Popper Falsification Engine, PTT/EGATS brain, FastMCP, and Deterministic Tier-2 Verifiers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "All rights reserved, see LICENSE"}
dependencies = []                     # core is stdlib-only

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]                # only the MCP server needs this

[project.scripts]
agentpentest = "agentpentest.campaign:_cli"          # full pipeline (simulation)
agentpentest-recon = "agentpentest.orchestrator:_cli"  # Phase-1 recon loop
agentpentest-view = "agentpentest.viewer:_cli"        # inspect a saved PTT / run log
agentpentest-ui = "agentpentest.webui:_cli"           # local web dashboard (localhost)
agentpentest-lock = "agentpentest.lock:_cli"          # toggle RUN_DISABLED lock
agentpentest-audit = "agentpentest.audit:_cli"        # score a run's SQLite memory (read-only)
agentpentest-report = "agentpentest.postrun:_cli"
agentpentest-asm = "agentpentest.asm:_cli"
agentpentest-pci = "agentpentest.segmentation:_cli"
agentpentest-web = "agentpentest.web_scanner:_cli"

[tool.setuptools]
packages = ["agentpentest"]

[tool.setuptools.package-data]
agentpentest = ["data/*.json", "data/*.csv", "webui_static/*"]
# RUN_DISABLED is intentionally NOT packaged: it is a machine-local build-only lock,
# not something to bake into a wheel or the Kali image.

[tool.pytest.ini_options]
testpaths = ["tests"]
